<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sito non raggiungibile</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, sans-serif; background: #fff; color: #1f2937; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { color: #0063a6; font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; }
    button { background: #0063a6; color: #fff; border: 0; border-radius: 8px; padding: 14px 32px; font-size: 1rem; cursor: pointer; }
    button:focus-visible { outline: 3px solid #0063a6; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <!-- Questa pagina compare sia senza internet sia quando il sito risponde con un errore
         (Capacitor la apre in tutti e due i casi): il testo deve essere vero per entrambi. -->
    <h1>Non riesco a raggiungere tiformiamonoi.it</h1>
    <p>Controlla la connessione o riprova tra poco</p>
    <button type="button" id="riprova">Riprova</button>
  </main>
  <script>
    // Si riprova la pagina che non si è caricata, al suo posto nella cronologia: così si
    // resta dov'eri e, rientrati, "indietro" dalla Home chiude l'app. Se non c'è una pagina
    // prima di questa (caso raro), si va all'indirizzo che l'app passa qui (?torna=...).
    document.getElementById('riprova').onclick = function () {
      if (history.length > 1) history.back()
      else location.replace(new URLSearchParams(location.search).get('torna') || 'https://app.tiformiamonoi.it/login')
    }
  </script>
</body>
</html>
